     <div class="piece-description" hidden>
         <p>Accidental Confessional is a visual confession that uses the fragility of glass to explore the heavy consequences of personal failure. The work traces a narrative that begins with a missed detail, setting off a chain reaction made physical through a chaotic, spiraling plane constructed from hot sculpted clear glass, a smoky flared glass disk, and a weathered, painted concrete plinth. Ultimately, the installation confronts the viewer with an introspective question: How does personal lack of discipline get projected onto one's perceived identity, and in doing so, how does it unjustly challenge the merit of others who have succeeded in their own fields? </p>
     </div>
        <figcaption>

        <span class="label-medium">blown & sculpted glass, concrete, paint</span>

      <div class="piece-description" hidden>
         <p>This wall mounted sculpture explores mechanical leverage, structural strain, and the physical limits of hot glass. In the hotshop, a molten clear glass bubble was hot slumped directly over one hexagonal head of a heavy cast iron dumbbell, forming a precise, form fitting socket as it cooled. Mounted horizontally onto a painted wooden block, the piece relies on cantilevered tension to suspend the dense iron weight outward into space. The work contrasts the visual weight and raw industrial utility of iron against the apparent fragility and optical clarity of the glass joint supporting it.</p>
     </div>

      <div class="piece-description" hidden>
        <p>Cantilevered from the gallery walls on slender welded steel armatures, two abstracted blown glass wingtips bank toward a corner, translating the aerodynamics of flight into fragile, luminous vessels. Sheathed in translucent green and red gradients over exposed steel ribs, the forms reference aviation navigation lights where port and starboard colors communicate spatial orientation in the dark while casting long, refractive shadows across the walls. Anchoring the corner below is a painted wood lightbox modeled after a Precision Approach Path Indicator (PAPI), an airfield beacon system in which an even split of two red and two white lights confirms to a pilot that their aircraft is on the proper glide path for landing.</p>
        <p>Drawing directly from my experience flying aircraft in these exact landing patterns, the installation examines the difference between mechanical guidance and internal alignment. While cockpit instrumentation and runway beacons offered an external metric for being "on course," flying never felt right; transitioning from aviation to the glass studio brought an immediate, intuitive sense of equilibrium. By pairing rigid steel wing ribs with the fluid responsiveness of hot glass, the work captures that shift from following prescribed trajectories in the sky to finding a true, self-directed landing in craft. </p>
      </div>

        <div class="piece-description" hidden>
        <p>Nestled between folded garments inside an open carry-on suitcase, four clear blown-glass domes seal in clusters of bananas, coffee candies, dried sardines, and shrimp chips. The sculptural vessels are modeled after kangina, an ancient Afghan food preservation technique in which mud and straw bowls are sealed together to keep fruit fresh across long mountain journeys. By reimagining these protective earthen shells in transparent glass and adhesive, the piece turns hidden baggage contents into luminous, museum-like specimens cushioned by everyday clothing.</p>
        <p>The work draws directly from the familiar ritual of my grandmother bringing flavors from Ecuador home in her luggage, navigating international borders and airport security to share a taste of place. Translating a traditional mountain storage method into fragile glass inside modern travel gear highlights the care, ingenuity, and quiet defiance involved in carrying cultural memory across distances. By replacing opaque clay with clear glass, the installation lays bare the personal cargo we pack to keep family heritage intact.   </p>
      </div>

        <div class="piece-description" hidden>
         <p>The Orange Algorithm is an immersive installation that dissects the anatomy of artistic creation and public analysis. Set within a pseudo-clinical environment, the work positions the viewer as both an observed "artist-patient" and an external critic. At the heart of the installation, a steel reclining apparatus and incline ramp featuring articulated blades and lollipop spheres suggest a rigid, mechanical choreography. Alongside this structure sits a clear glass specimened vessel holding two contrasting forms in dynamic equilibrium: an unpeeled glass orange floating buoyant at the water's surface, and a peeled cast bronze orange sinking to the bottom. Above, a suspended array of custom optical lenses distorts and magnifies the scene, acting as lenses through which the artist's internal doubts, anxieties, and desire for self-protection are made visible for public scrutiny. Above this tableau hangs a precise array of custom optical lenses the primary focal mechanism through which every viewer's interpretation of the artist's underlying self qustioning is refracted and distorted. </p>
     </div>

<!-- Portfolio Grid Auto-Organization by Year-->
<script>
const grid = document.querySelector('.grid');
const colLeft = document.getElementById('col-left');
const colRight = document.getElementById('col-right');
const figures = Array.from(grid.querySelectorAll('figure'));
figures.sort((a, b) => b.dataset.year - a.dataset.year);

const isMobile = window.matchMedia('(max-width: 760px)').matches;

if (isMobile) {
  figures.forEach(fig => colLeft.appendChild(fig));
} else {
  figures.forEach((fig, i) => {
    (i % 2 === 0 ? colLeft : colRight).appendChild(fig);
  });
}
</script>

<!-- Light Box (Fullscreen Gallery View w/ Detail Shots) -->
<script>
const lightbox = document.getElementById('lightbox');
const lbImage = lightbox.querySelector('.lb-image');
const lbInfo = document.getElementById('lb-info');
let currentSet = [];
let currentIndex = 0;

function openLightbox(figure, startIndex) {
  const cover = figure.querySelector('img.cover');
  const extras = figure.querySelectorAll('.extra-shots img');
  currentSet = [cover, ...extras];
  currentIndex = startIndex;
  lbInfo.innerHTML = buildInfo(figure);
  showImage();
  lightbox.hidden = false;
}
function buildInfo(figure) { 
  const cap = figure.querySelector('figcaption');
  const desc = figure.querySelector('.piece-description');
  let html = '';
  if (cap) html += '<div class="lb-details">' + cap.innerHTML + '</div>';
  if (desc && desc.textContent.trim()) html += '<div class="lb-description">' + desc.innerHTML + '</div>';
  return html;
}
function showImage() {
  const img = currentSet[currentIndex];
  lbImage.src = img.src;
  lbImage.alt = img.alt;
}
document.querySelectorAll('figure').forEach(fig => {
  const cover = fig.querySelector('img.cover');
  if (cover) cover.addEventListener('click', () => openLightbox(fig, 0));
});
lightbox.querySelector('.lb-close').addEventListener('click', () => lightbox.hidden = true);
lightbox.querySelector('.lb-prev').addEventListener('click', () => {
  currentIndex = (currentIndex - 1 + currentSet.length) % currentSet.length;
  showImage();
});
lightbox.querySelector('.lb-next').addEventListener('click', () => {
  currentIndex = (currentIndex + 1) % currentSet.length;
  showImage();
});
lightbox.addEventListener('click', e => { if (e.target === lightbox) lightbox.hidden = true; });
document.addEventListener('keydown', e => {
  if (lightbox.hidden) return;
  if (e.key === 'Escape') lightbox.hidden = true;
  if (e.key === 'ArrowRight') lightbox.querySelector('.lb-next').click();
  if (e.key === 'ArrowLeft') lightbox.querySelector('.lb-prev').click();
});
</script>
