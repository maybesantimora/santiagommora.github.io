<!-- Portfolio Grid Auto-Organization by Year-->
<script>
const grid = document.querySelector('.grid');
const colLeft = document.getElementById('col-left');
const colRight = document.getElementById('col-right');
const figures = Array.from(grid.querySelectorAll('figure'));
figures.sort((a, b) => b.dataset.year - a.dataset.year);
figures.forEach((fig, i) => {
  (i % 2 === 0 ? colLeft : colRight).appendChild(fig);
});
</script>

<!-- Light Box (Fullscreen Gallery View w/ Detail Shots) -->
<script>
const lightbox = document.getElementById('lightbox');
const lbImage = lightbox.querySelector('.lb-image');
let currentSet = [];
let currentIndex = 0;

function openLightbox(figure, startIndex) {
  const cover = figure.querySelector('img.cover');
  const extras = figure.querySelectorAll('.extra-shots img');
  currentSet = [cover, ...extras];
  currentIndex = startIndex;
  showImage();
  lightbox.hidden = false;
}
function showImage() {
  const img = currentSet[currentIndex];
  lbImage.src = img.src;
  lbImage.alt = img.alt;
}
document.querySelectorAll('figure').forEach(fig => {
  const cover = fig.querySelector('img.cover');
  if (cover) cover.addEventListener('click', () => openLightbox(fig, 0));
});
lightbox.querySelector('.lb-close').addEventListener('click', () => lightbox.hidden = true);
lightbox.querySelector('.lb-prev').addEventListener('click', () => {
  currentIndex = (currentIndex - 1 + currentSet.length) % currentSet.length;
  showImage();
});
lightbox.querySelector('.lb-next').addEventListener('click', () => {
  currentIndex = (currentIndex + 1) % currentSet.length;
  showImage();
});
lightbox.addEventListener('click', e => { if (e.target === lightbox) lightbox.hidden = true; });
document.addEventListener('keydown', e => {
  if (lightbox.hidden) return;
  if (e.key === 'Escape') lightbox.hidden = true;
  if (e.key === 'ArrowRight') lightbox.querySelector('.lb-next').click();
  if (e.key === 'ArrowLeft') lightbox.querySelector('.lb-prev').click();
});
</script>
