  <!-- ============ PORTFOLIO ============
       Each piece is one block from <figure> to </figure>. For each piece, edit 3 things:
         1. the photo file name inside src="images/..."
         2. the alt text (a short description, for people who can't see the photo)
         3. the caption: title, size, and whether it is available
       To ADD a piece: copy a whole block and paste it below the last one.
       To REMOVE a piece: delete its whole block. -->
  <section>
    <h2>Portfolio</h2>
    <div class="grid">
